# Kept in tools/ in the private dev repo; publish_public.py copies it to .github/dependabot.yml in the public repo.
# Opens a pull request when an action used by the workflows (checkout, setup-python, the Pages actions) has a new version.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
