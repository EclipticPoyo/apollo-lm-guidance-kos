name: Manual site

# Kept in tools/ in the private dev repo; publish_public.py copies it to .github/workflows/ in the public repo.
# Builds the pilot's manual (docs/MANUAL.md) into a web page and publishes it with GitHub Pages.
# Pages is switched on in the PUBLIC repo only (Settings > Pages > Source: GitHub Actions); the guard below keeps this
# from running in the private dev repo, where Pages is not available.
on:
  push:
    branches: [main]
    paths:
      - docs/MANUAL.md
      - docs/MANUAL.pdf
      - docs/images/**
      - make_site.py
      - VERSION
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as in GitHub's own Pages template: build uploads the page, deploy (a later job) publishes it. With both in one job the
# deploy step ran a second after the upload and could not see the artifact ("Found 0 artifact(s)", 2026-11-22, twice).
jobs:
  build:
    if: github.repository == 'EclipticPoyo/apollo-lm-guidance-kos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install markdown
      - run: python make_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
