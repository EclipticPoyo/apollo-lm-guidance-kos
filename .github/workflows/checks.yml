name: Offline checks

# Kept in tools/ in the private dev repo; publish_public.py copies it to .github/workflows/ in the public repo.
# check_all.py runs everything that needs no KSP: name clashes, bracket balance, script paths, the manual against
# the code, and the pad-test list.
# The pad tests and flights still run in KSP (see docs/DEVELOPMENT.md).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Offline checks (names, syntax, paths, pack, pad-test list)
        run: python scripts/tests/check_all.py
